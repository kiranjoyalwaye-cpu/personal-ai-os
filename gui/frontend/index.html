<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal AI OS Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Personal AI OS Dashboard</h1>
      <p>Transparent inspection of memory, identity, goals, snapshots, and audit.</p>
      <nav>
        <a href="agents.html">Open Multi-Agent Control Room</a>
      </nav>
    </header>

    <main>
      <section class="panel" id="memory-panel">
        <h2>Memory</h2>
        <form id="memory-form">
          <input type="text" id="memory-text" placeholder="Memory text" required />
          <input type="number" id="memory-emotion" min="0" max="1" step="0.1" value="0.5" />
          <input type="number" id="memory-importance" min="0" max="1" step="0.1" value="0.5" />
          <button type="submit">Add Memory</button>
        </form>
        <ul id="memory-list"></ul>
      </section>

      <section class="panel" id="identity-panel">
        <h2>Identity</h2>
        <form id="identity-form">
          <input type="text" id="identity-trait" placeholder="New trait" required />
          <select id="identity-category">
            <option value="preferences">Preferences</option>
            <option value="personality_hints" selected>Personality Hints</option>
            <option value="long_term_characteristics">Long-Term Characteristics</option>
          </select>
          <button type="submit">Add Trait</button>
        </form>
        <div class="identity-columns">
          <div>
            <h3>Preferences</h3>
            <ul id="identity-preferences"></ul>
          </div>
          <div>
            <h3>Personality Hints</h3>
            <ul id="identity-personality"></ul>
          </div>
          <div>
            <h3>Long-Term Characteristics</h3>
            <ul id="identity-longterm"></ul>
          </div>
        </div>
      </section>

      <section class="panel" id="goals-panel">
        <h2>Goals</h2>
        <form id="goals-form">
          <input type="text" id="goal-text" placeholder="Goal text" required />
          <button type="submit">Add Goal</button>
        </form>
        <ul id="goals-list"></ul>
      </section>

      <section class="panel" id="snapshots-panel">
        <h2>Snapshots</h2>
        <button id="snapshot-create">Create Snapshot</button>
        <ul id="snapshot-list"></ul>
      </section>

      <section class="panel" id="audit-panel">
        <h2>Audit Log</h2>
        <button id="audit-refresh">Refresh Log</button>
        <pre id="audit-log"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
